version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: decentraid-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decentraid}
      POSTGRES_USER: ${POSTGRES_USER:-decentraid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decentraid_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decentraid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: decentraid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decentraid-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-decentraid}:${POSTGRES_PASSWORD:-decentraid_password}@postgres:5432/${POSTGRES_DB:-decentraid}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      POLYGON_AMOY_RPC_URL: ${POLYGON_AMOY_RPC_URL:-https://rpc-amoy.polygon.technology}
      IPFS_API_URL: ${IPFS_API_URL:-/ip4/127.0.0.1/tcp/5001}
      ANOMALY_SERVICE_URL: http://anomaly-detection:8001
      DEBUG: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-not-for-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-encryption-key-not-for-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Anomaly Detection Service
  anomaly-detection:
    build:
      context: ./anomaly-detection
      dockerfile: Dockerfile
    container_name: decentraid-anomaly
    environment:
      BACKEND_API_URL: http://backend:8000
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./anomaly-detection:/app
      - model_data:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decentraid-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_ANOMALY_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: decentraid-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
      - anomaly-detection

  # IPFS Node (optional)
  ipfs:
    image: ipfs/kubo:latest
    container_name: decentraid-ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  postgres_data:
  redis_data:
  model_data:
  ipfs_data:
