# =============================================================================
# DecentraID CI Pipeline
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Smart Contract Tests
  # ===========================================================================
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      
      - name: Install dependencies
        working-directory: contracts
        run: npm ci
      
      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile
      
      - name: Run tests
        working-directory: contracts
        run: npx hardhat test

  # ===========================================================================
  # Backend Tests
  # ===========================================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: decentraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Create dummy deployment files
        run: |
          mkdir -p contracts/deployments/amoy
          echo '{"address":"0x0000000000000000000000000000000000000000","abi":[]}' > contracts/deployments/amoy/DecentraIDIdentity.json
          echo '{"address":"0x0000000000000000000000000000000000000000","abi":[]}' > contracts/deployments/amoy/DecentraIDAccessControl.json
          echo '{"address":"0x0000000000000000000000000000000000000000","abi":[]}' > contracts/deployments/amoy/DecentraIDAssets.json
      
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      
      - name: Run tests
        working-directory: backend
        run: pytest -v --tb=short --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/decentraid_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          ENCRYPTION_KEY: test-encryption-key
          POLYGON_AMOY_RPC_URL: https://rpc-amoy.polygon.technology
      
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend

  # ===========================================================================
  # Frontend Build & Tests
  # ===========================================================================
  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run lint
        working-directory: frontend
        run: npm run lint || true
      
      - name: Run tests
        working-directory: frontend
        run: npm test || true
      
      - name: Build
        working-directory: frontend
        run: npm run build

  # ===========================================================================
  # Anomaly Detection Tests
  # ===========================================================================
  anomaly-detection:
    name: Anomaly Detection Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: anomaly-detection/requirements.txt
      
      - name: Install dependencies
        working-directory: anomaly-detection
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        working-directory: anomaly-detection
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml
      
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: anomaly-detection/coverage.xml
          flags: anomaly-detection

  # ===========================================================================
  # Docker Build -- parallel, fast, only validates Dockerfiles build
  # ===========================================================================
  docker-backend:
    name: Docker Build - Backend
    runs-on: ubuntu-latest
    needs: [backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: decentraid/backend:latest
          cache-from: type=gha,scope=docker-backend
          cache-to: type=gha,mode=max,scope=docker-backend

  docker-anomaly:
    name: Docker Build - Anomaly Detection
    runs-on: ubuntu-latest
    needs: [anomaly-detection]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build anomaly-detection image
        uses: docker/build-push-action@v5
        with:
          context: ./anomaly-detection
          push: false
          tags: decentraid/anomaly-detection:latest
          cache-from: type=gha,scope=docker-anomaly
          cache-to: type=gha,mode=max,scope=docker-anomaly

  docker-frontend:
    name: Docker Build - Frontend
    runs-on: ubuntu-latest
    needs: [frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: decentraid/frontend:latest
          cache-from: type=gha,scope=docker-frontend
          cache-to: type=gha,mode=max,scope=docker-frontend
