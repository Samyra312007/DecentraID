name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please describe your idea so we can evaluate and prioritize it.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of DecentraID would this feature affect?
      options:
        - Smart Contracts
        - Backend API
        - Frontend
        - Anomaly Detection
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: Describe your ideal solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Other approaches I've considered...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical — blocks my workflow
    validations:
      required: true

  - type: dropdown
    id: willing
    attributes:
      label: Willingness to Contribute
      description: Would you be willing to implement this feature?
      options:
        - Yes, I'd like to submit a PR
        - I can help with testing
        - I can help with documentation
        - No, I'm just suggesting
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references for the feature request.
      placeholder: Add any context, screenshots, or links here...
